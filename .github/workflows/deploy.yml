name: Deploy Worker
on:
  workflow_dispatch:
  repository_dispatch:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build & Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
      - name: Temporary Xiaohongshu anonymous probe
        shell: bash
        run: |
          set -u
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Version/17.0 Mobile/15E148 Safari/604.1'
          SHORT_URL='https://xhslink.cn/o/6SIfJc8YqQe'
          FINAL_URL="$(curl -LsS --max-time 30 -A "$UA" -o /dev/null -w '%{url_effective}' "$SHORT_URL" || true)"
          echo "FINAL_PATH=$(python -c 'import sys,urllib.parse;u=urllib.parse.urlsplit(sys.argv[1]);print(u.netloc+u.path)' "$FINAL_URL")"
          RSS_URL="$(python -c 'import sys,urllib.parse;u=urllib.parse.urlsplit(sys.argv[1]);parts=[p for p in u.path.split("/") if p];uid=parts[-1] if parts else "";q=[(k,v) for k,v in urllib.parse.parse_qsl(u.query,keep_blank_values=True) if k in {"xsec_token","xsec_source","xhsshare","shareRedId","apptime","share_id","share_channel"}];print("https://rss-worker.chinachanjan.workers.dev/rss/xiaohongshu/user/"+urllib.parse.quote(uid)+"?"+urllib.parse.urlencode(q))' "$FINAL_URL")"
          CURL_META="$(curl -sS --max-time 90 -D /tmp/xhs-headers.txt -o /tmp/xhs-body.txt -w '%{http_code} %{time_total}' "$RSS_URL" || true)"
          HTTP_CODE="$(echo "$CURL_META" | awk '{print $1}')"
          TIME_TOTAL="$(echo "$CURL_META" | awk '{print $2}')"
          echo "HTTP=$HTTP_CODE"
          echo "TIME_TOTAL=$TIME_TOTAL"
          echo "CONTENT_TYPE=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\\r/,""); print substr($0,index($0,":")+2); exit}' /tmp/xhs-headers.txt)"
          python -c 'import xml.etree.ElementTree as ET; r=ET.parse("/tmp/xhs-body.txt").getroot(); c=r.find("channel"); items=c.findall("item"); f=items[0] if items else None; print("ITEM_COUNT="+str(len(items))); print("CHANNEL_TITLE="+((c.findtext("title") or "")[:200])); print("FIRST_ITEM_TITLE="+((f.findtext("title") or "")[:200] if f is not None else "")); print("FIRST_ITEM_LINK="+((f.findtext("link") or "")[:240] if f is not None else "")); print("FIRST_ITEM_GUID="+((f.findtext("guid") or "")[:240] if f is not None else "")); assert items and f.findtext("title") and f.findtext("link") and f.findtext("guid")'
