name: Deploy Worker
on:
  workflow_dispatch:
  repository_dispatch:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build & Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
      - name: Temporary probe Xiaohongshu title search
        shell: bash
        run: |
          set -eu
          URL='https://rss-worker.chinachanjan.workers.dev/rss/xiaohongshu/user/628dcef5000000001000de08?debug=search&keyword=%E5%B0%8F%E7%8C%AB%E5%92%AA%E4%BC%9A%E6%9C%89%E4%BB%80%E4%B9%88%E7%83%A6%E5%BF%83%E4%BA%8B%E5%91%A2~'
          sleep 6
          META="$(curl -sS --max-time 90 -D /tmp/search.headers -o /tmp/search.body -w '%{http_code} %{time_total}' "$URL" || true)"
          echo "META=$META"
          echo "CONTENT_TYPE=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\\r/,""); print substr($0,index($0,":")+2); exit}' /tmp/search.headers)"
          python -c 'from pathlib import Path; import json,pprint; b=Path("/tmp/search.body").read_text(errors="replace"); print(b[:5000]) if not b.lstrip().startswith(("{","[")) else pprint.pp(json.loads(b), width=140)'

